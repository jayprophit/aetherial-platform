# ============================================================================
# BUILD MANIFEST - aetherial-platform
# ============================================================================
# Authoritative record of how this project is built, tested and
# verified, and of what is still broken. Read by Aetherius-OS's
# build manifest registry and validated by
# src/programme/buildManifest.ts.
#
# Promoted from Temp/Repository-Reconciliation on 2026-10-20. The
# manifest records what was measured, not what the repository's own
# documentation claims. Last re-measured on 2026-10-29 against the
# live tRPC program.
# ============================================================================
schema_version: "1.0.0"

project:
  id: aetherial-platform
  name: aetherial-platform
  kind: application
  domain: aetherial-platform
  description: >-
    The unified platform: commerce, e-learning, social media and finance in one system. The live program is the tRPC + OAuth entry in server/_core; the repository also carries a separate, unmounted legacy REST tree, a database schema, a mobile app, a desktop app and container deployment.
  repository: true
  branch: main
  languages: [js, jsx, py, sh, sql, ts, tsx]

toolchain:
  build_system: node/npm + vite/esbuild
  package_manager: npm
  requirements:
    - name: "node"
      version: ">=20"
      required: true
      purpose: "runtime and build; measured with Node 26.12.1"
    - name: "npm"
      version: "10+"
      required: true
      purpose: "dependency install and script runner"
    - name: "python"
      version: "3"
      required: false
      purpose: "legacy pytest corpus; dependencies are not installed and collection fails"

commands:
  - name: install
    command: "npm install --legacy-peer-deps"
    working_directory: .
    timeout_minutes: 20
  - name: build
    command: "npm run build"
    working_directory: .
    timeout_minutes: 20
  - name: test
    command: "npm run test"
    working_directory: .
    timeout_minutes: 30
  - name: verify
    command: "npm run check:app"
    working_directory: .
    timeout_minutes: 20
    requires: [install]
  - name: check:full
    command: "npm run check"
    working_directory: .
    timeout_minutes: 30
    requires: [install]
  - name: test:python
    command: "python -m pytest tests -q"
    working_directory: .
    timeout_minutes: 20

dependencies:
  projects: []
  external:
    - "react 19 + vite 7"
    - "express 4 + @trpc/server"
    - "drizzle-orm (schema present; live entry uses an in-memory user store)"
    - "hardhat 3.21.1 with @nomicfoundation/hardhat-toolbox 6.1.2 (peer conflict)"

status:
  state: PARTIAL
  last_verified: "2026-10-29"
  summary: >-
    The live tRPC program is clean and runnable: check:app exits 0, the
    Vitest suite passes 61/61, the production build succeeds, and the
    built server serves the app and answers auth.me. The project remains
    PARTIAL because the full-tree typecheck is red (1,668 errors in 215
    files), the legacy REST routes are not mounted by the live entry, and
    the legacy Python tests cannot collect without heavyweight
    dependencies.
  evidence:
    - "git remote get-url origin -> https://github.com/jayprophit/aetherial-platform.git"
    - "git rev-parse --abbrev-ref HEAD -> main"
    - "git log -1 --format=%H -> 3fa98dec3b0d722d0751351023569ffce2eddd6e"
    - "git log -1 --format=%ad --date=short -> 2026-10-20"
    - "Measured own source: 707 files, 185,362 lines across ts/tsx/js/jsx/py/sh/sql, excluding node_modules, dist, .git and coverage."
    - "Measured tests: 10 TypeScript test/spec files plus 3 Python test files."
    - "npm run check:app -> exit 0 (tsc -p tsconfig.app.json --noEmit; live entry client/src/main.tsx + server/_core/index.ts)."
    - "npx vitest run -> exit 0; 4 files, 61 tests passed (2026-10-29)."
    - "npm run build -> exit 0; Vite transformed 3,315 modules; dist/public/index.html 365,940 bytes; dist/public/assets/index-BZH9_Ka8.js 2,305,651 bytes; dist/public/assets/index-v7i5wJas.css 241,727 bytes; dist/index.js 38,496 bytes."
    - "node dist/index.js on port 3126 -> GET / 200 (365,918 bytes); GET /api/trpc/auth.me 200 with {\"result\":{\"data\":{\"json\":null}}}; server log '[OAuth] ERROR: OAUTH_SERVER_URL is not configured!'."
    - "npx tsc --noEmit -> exit 2; 1,668 errors in 215 files. By area: server/routes 657, client/imported 450, server/auth 144, server/_core 81, server/services 36, client/pages 24, remaining modules 276."
    - "python -m pytest tests -q --collect-only -> exit 2; 3 tests collected, 2 collection errors (torch/transformers/datasets missing; web3/eth_tester missing); 250.41 s."

known_issues:
  - id: AETHERIAL-PLATFORM-LIC-001
    severity: medium
    summary: >-
      No licence file. The owner chooses which licence applies.
    evidence: >-
      No LICENSE or LICENCE file at the repository root.
    status: OPEN

  - id: AETHERIAL-PLATFORM-TYPECHECK-001
    severity: high
    summary: >-
      The full-tree typecheck is red: 1,668 errors in 215 files.
    evidence: >-
      npx tsc --noEmit exit 2 on 2026-10-29. Concentrated in the unmounted
      legacy trees: server/routes 657, client/imported 450, server/auth 144,
      server/_core 81, server/services 36, client/pages 24.
    status: OPEN

  - id: AETHERIAL-PLATFORM-BACKEND-001
    severity: high
    summary: >-
      The live tRPC entry does not mount the legacy REST routes, so the
      feature pages have no live backend.
    evidence: >-
      server/_core/index.ts mounts only tRPC + OAuth. server/index.ts mounts
      server/routes, which is a separate, unbuilt entry. Those routes call
      getDb() from a shim that lacks Drizzle .limit, .innerJoin, .update and
      insert result semantics, and the REST tree is not bundled by
      npm run build.
    status: OPEN

  - id: AETHERIAL-PLATFORM-AUTH-001
    severity: high
    summary: >-
      OAuth is unconfigured in this workspace.
    evidence: >-
      No .env file. VITE_OAUTH_PORTAL_URL, VITE_APP_ID and OAUTH_SERVER_URL
      are unset. getLoginUrl() throws a clear configuration error, the built
      server logs '[OAuth] ERROR: OAUTH_SERVER_URL is not configured!', and
      auth.me returns null.
    status: OPEN

  - id: AETHERIAL-PLATFORM-STORE-001
    severity: high
    summary: >-
      The live user store is in memory, not a database.
    evidence: >-
      server/_core/db.ts uses dbStore.users; users and sessions reset when
      the process restarts. The Drizzle schema and migrations exist but are
      not wired into the live entry.
    status: OPEN

  - id: AETHERIAL-PLATFORM-CONTRACT-001
    severity: medium
    summary: >-
      The legacy REST contract does not cover what the pages render.
    evidence: >-
      No DELETE /friends/:id; profile PUT ignores email, location and
      website; list endpoints omit course duration, product condition and
      job requirements/benefits; the friends query omits email. The client
      facade normalizes the missing fields to empty values and warns where a
      write would otherwise be silently dropped.
    status: OPEN

  - id: AETHERIAL-PLATFORM-CAPTURE-001
    severity: medium
    summary: >-
      85 imported captures are unusable as source and are quarantined.
    evidence: >-
      56 *.unavailable placeholders and 29 *.truncated files under
      client/src/components/imported/, listed in CAPTURE-STATUS.md. Original
      bytes are preserved; the files are reference material, not application
      source.
    status: ACCEPTED

  - id: AETHERIAL-PLATFORM-DEPS-001
    severity: medium
    summary: >-
      hardhat 3.21.1 conflicts with @nomicfoundation/hardhat-toolbox 6.1.2,
      which requires hardhat ^2.28.0.
    evidence: >-
      npm install fails peer resolution without --legacy-peer-deps.
    status: OPEN

  - id: AETHERIAL-PLATFORM-HTML-001
    severity: medium
    summary: >-
      The production HTML ships literal Vite placeholders.
    evidence: >-
      client/index.html uses %VITE_APP_LOGO%, %VITE_APP_TITLE%,
      %VITE_ANALYTICS_ENDPOINT% and %VITE_ANALYTICS_WEBSITE_ID%. The variables
      are unset, vite build warns, and dist/public/index.html still contains
      the literal %VITE_*% strings.
    status: OPEN

  - id: AETHERIAL-PLATFORM-PYTEST-001
    severity: low
    summary: >-
      The legacy Python tests cannot collect in this workspace.
    evidence: >-
      pytest exits 2 with 3 tests collected and 2 collection errors because
      torch, transformers, datasets, web3 and eth_tester are not installed.
      The suite also took 250.41 s to fail collection.
    status: OPEN

notes:
  - >-
    Promoted into the workspace on 2026-10-20 from
    Temp/Repository-Reconciliation, where a desktop-duplicate reconciliation
    had set it aside. The repository was a clean clone of the owner's GitHub
    remote on the branch named above, with no uncommitted work at the time of
    promotion.
  - >-
    The live program is gated by tsconfig.app.json + npm run check:app. The
    full-tree npm run check remains a separate backlog, recorded above.
  - >-
    client/src/components/imported/ is an imported component corpus kept as
    reference material. It is excluded from the live gate; CAPTURE-STATUS.md
    records which captures are unavailable or truncated.
  - >-
    The client API facade in client/src/lib/api.ts unwraps the legacy REST
    envelopes and normalizes rows to page models. It does not claim that the
    REST backend is mounted.
