# ============================================================================
# BUILD MANIFEST - aetherial-platform
# ============================================================================
# Authoritative record of how this project is built, tested and
# verified, and of what is still broken. Read by Aetherius-OS's
# build manifest registry and validated by
# src/programme/buildManifest.ts.
#
# Promoted from Temp/Repository-Reconciliation on 2026-10-20, where an earlier desktop-duplicate
# reconciliation had set it aside. The manifest records what was
# measured at the time of promotion, not what the repository's own
# documentation claims.
# ============================================================================
schema_version: "1.0.0"

project:
  id: aetherial-platform
  name: aetherial-platform
  kind: application
  domain: aetherial-platform
  description: >-
    The unified platform: commerce, e-learning, social media and finance in one system, with contracts, a database schema, a mobile app, a desktop app and container deployment.
  repository: true
  branch: main
  languages: [js, jsx, py, sh, sql, ts, tsx]

toolchain:
  build_system: node/npm
  package_manager: npm
  requirements:
    - name: "node"
      version: ">=20"
      required: true
      purpose: "the runtime that executes the package"
    - name: "the project's own test script"
      version: "vitest run"
      required: false
      purpose: "the repository's declared test command"

commands:
  - name: build
    command: "npm run build"
    working_directory: .
    timeout_minutes: 20
  - name: test
    command: "npm run test"
    working_directory: .
    timeout_minutes: 30
  - name: test
    command: "python -m pytest tests -q"
    working_directory: .
    timeout_minutes: 20

dependencies:
  projects: []
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-20"
  summary: >-
    The project holds 200070 lines of its own source across 7 language(s) and
    24 test file(s). The build has not been run as part of the workspace gate,
    so the recorded state is partial rather than verified.
  evidence:
    - "git remote get-url origin -> https://github.com/jayprophit/aetherial-platform.git"
    - "git rev-parse --abbrev-ref HEAD -> main"
    - "git log -1 --format=%H -> d37b2dd5ae83c3a2aaa4240642aa3febcbc24dfc"
    - "git log -1 --format=%ad --date=short -> 2025-10-30"
    - "Measured own source lines: 200070. Measured test files: 24."

known_issues:
  - id: AETHERIAL-PLATFORM-LIC-001
    severity: medium
    summary: >-
      No licence file. The owner chooses which licence applies.
    evidence: >-
      No LICENSE or LICENCE file at the repository root.
    status: OPEN

notes:
  - >-
    Promoted into the workspace on 2026-10-20 from
    Temp/Repository-Reconciliation, where a desktop-duplicate
    reconciliation had set it aside. The repository was a clean
    clone of the owner's GitHub remote on the branch named above,
    with no uncommitted work at the time of promotion.
  - >-
    The state recorded here is what was measured at promotion. It
    is a starting point, and the gate that will move it forward is
    the build command recorded in the commands section above.
